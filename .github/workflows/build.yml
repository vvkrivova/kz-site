# Сборка сайта и загрузка на хостинг — после каждой правки в панели Pages CMS и каждой выгрузки в main.
# 1) уменьшает загруженные фото (tools/optimize_images.py), 2) собирает страницы, шапку/подвал, цены аренды,
#    английскую версию и метки версий (tools/build.py), 3) сохраняет результат в main,
# 4) загружает сайт на хостинг tianway.kg по FTP — только если в настройках репозитория заданы секреты
#    (Settings → Secrets and variables → Actions):
#      FTP_SERVER, FTP_USERNAME, FTP_PASSWORD — доступ к хостингу kyrgyz.cloud (Plesk → Доступ по FTP);
#      BITRIX_WEBHOOK — адрес входящего вебхука Битрикс24 (права CRM и «Онлайн-запись»; из него на хостинге создается lead-config.php);
#      BOOKING_ROBOT_SECRET — пароль, который робот Битрикса передает обработчику автоматической брони (api/bitrix/confirm-booking.php).
#    Необязательные переменные (Variables): FTP_DIR — папка сайта на хостинге (по умолчанию httpdocs/),
#    FTP_PROTOCOL — ftp (по умолчанию: хостинг kyrgyz.cloud, ProFTPD, шифрование FTPS не поддерживает) или ftps.
# 5) просит GitHub Pages обновить копию сайта vvkrivova.github.io/kz-site.
# Пауза загрузки на хостинг: пока в репозитории есть файл .deploy-hold, шаги 4 (ключ Битрикса и FTP) пропускаются —
# новая версия видна только на GitHub Pages (например, пока заказчик смотрит и утверждает цены). Убрать файл — и следующая
# выгрузка или правка в панели загрузит сайт на tianway.kg.
name: Сборка и загрузка сайта

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'   # без служебных файлов __pycache__ в репозитории
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      # сам ключ Битрикса виден только шагу, который пишет lead-config.php; здесь — лишь «есть / нет»
      HAS_BITRIX: ${{ secrets.BITRIX_WEBHOOK != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Пауза загрузки на хостинг?
        run: |
          if [ -f .deploy-hold ]; then
            echo "HOLD=true" >> "$GITHUB_ENV"
            echo "Есть файл .deploy-hold — на tianway.kg не загружаем, обновится только копия на GitHub Pages"
          fi

      - name: Курс Нацбанка для копии на GitHub Pages
        run: python tools/fetch_rates.py

      - name: Уменьшить загруженные фото
        run: |
          pip install --quiet pillow
          python tools/optimize_images.py

      - name: Собрать страницы
        run: python tools/build.py

      - name: Сохранить результат
        id: save
        run: |
          git config user.name "tianway-build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Изменений после сборки нет"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Сборка после правок в панели"
            # пока шла сборка, в панели могли сохранить еще одну правку — подтягиваем ее и пробуем еще раз
            for try in 1 2 3; do
              git pull --rebase --quiet && git push && break
              sleep 5
            done
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # ключ Битрикс24 — только на хостинге, в репозиторий не попадает (lead-config.php в .gitignore)
      - name: Ключ Битрикс24 для lead.php
        if: env.FTP_SERVER != '' && env.HAS_BITRIX == 'true' && env.HOLD != 'true'
        env:
          BITRIX_WEBHOOK: ${{ secrets.BITRIX_WEBHOOK }}
          BOOKING_ROBOT_SECRET: ${{ secrets.BOOKING_ROBOT_SECRET }}
        run: |
          python - <<'PY'
          import os
          clean = lambda v: (v or '').strip().replace('\\', '').replace("'", '')
          hook = clean(os.environ.get('BITRIX_WEBHOOK'))
          robot = clean(os.environ.get('BOOKING_ROBOT_SECRET'))
          open('lead-config.php', 'w', encoding='utf-8').write(
              "<?php\n// создан автозагрузкой (.github/workflows/build.yml) из секретов BITRIX_WEBHOOK и BOOKING_ROBOT_SECRET\n"
              f"return array('webhook' => '{hook}', 'robot_secret' => '{robot}', 'hosts' => array('tianway.kg', 'www.tianway.kg'));\n")
          PY

      - name: Загрузить сайт на хостинг
        if: env.FTP_SERVER != '' && env.HOLD != 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftp' }}
          server-dir: ${{ vars.FTP_DIR || 'httpdocs/' }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            templates/**
            tools/**
            .pages.yml
            .nojekyll
            .deploy-hold
            CLAUDE.md
            data/i18n/*.json
            data/i18n/missing.txt

      # коммит от этой сборки сам GitHub Pages не перезапускает — просим опубликовать явно
      - name: Обновить копию на GitHub Pages
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Публикацию запустить не удалось — GitHub Pages опубликует при следующем изменении"
