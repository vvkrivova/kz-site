      <footer class="footer footer--{{theme}}">
        <a class="footer__logo" href="index.html" aria-label="Tian Way — на главную"><img src="img/logo-footer-{{theme}}.webp" alt="Tian Way"></a>
        <a class="footer__phone" href="tel:{{phone_tel}}">{{phone}}</a>
        <a class="footer__mail" href="mailto:{{email}}">{{email}}</a>
        <div class="footer__social">
          <a href="{{instagram}}" target="_blank" rel="noopener" aria-label="Мы в Instagram"><img src="img/social-instagram.webp" alt=""></a>
          <a href="{{whatsapp}}" target="_blank" rel="noopener" aria-label="Написать в WhatsApp"><img src="img/social-whatsapp.webp" alt=""></a>
          <a href="{{telegram}}" target="_blank" rel="noopener" aria-label="Написать в Telegram"><img src="img/social-telegram.webp" alt=""></a>
        </div>
        <div class="footer__links">
          <a href="{{privacy_url}}">Политика конфиденциальности</a>
          <a href="{{offer_url}}">Публичная оферта</a>
          <span>{{copyright}}</span>
        </div>
        <p class="footer__note">{{meta_note}}</p>
      </footer>
