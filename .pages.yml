            fields:
              - { name: d1, label: "1–3 суток", type: number, required: true, options: { min: 0, max: 500000 } }
              - { name: d4, label: "4–6 суток", type: number, required: true, options: { min: 0, max: 500000 } }
              - { name: d7, label: "7–13 суток", type: number, required: true, options: { min: 0, max: 500000 } }
              - { name: d14, label: "14–20 суток", type: number, required: true, options: { min: 0, max: 500000 } }
