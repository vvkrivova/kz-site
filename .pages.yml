                - { value: from, label: "Разовая «от N сом» (в сумму не входит, точную назовет менеджер)" }
                - { value: free, label: "Бесплатно" }
                - { value: quote, label: "Цена по запросу" }
                - { value: delivery, label: "Доставка (за направление, бесплатно от N суток)" }
          - name: price
